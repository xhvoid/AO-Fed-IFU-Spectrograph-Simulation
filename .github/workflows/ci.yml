name: CI

# Run the test suite and the fast example scripts on every push / PR.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package (with test extra)
        run: |
          python -m pip install --upgrade pip
          pip install -e .[test]

      - name: Run unit tests
        # Artifact gates run separately, after fresh reports have been generated.
        run: pytest -q --ignore=tests/test_generated_artifacts.py

      - name: Committed figures were generated by this code
        # Published summaries record a hash of src/ + examples/; a stale one
        # means figures/ no longer describes the current implementation.
        env:
          AO_IFU_ARTIFACT_DIR: figures
          AO_IFU_REQUIRE_ARTIFACTS: "1"
        run: pytest -q tests/test_generated_artifacts.py -k generated_by_the_current_source

      - name: Run toy IFU demo (must finish quickly)
        run: python examples/run_toy_ifu_demo.py

      - name: Run fast integration (writes figures / CSV / JSON)
        run: python examples/run_fast_integration.py

      - name: Run public-data figures (offline; reads cached public data)
        run: python examples/run_public_data_figures.py

      - name: Run internal validation checks
        run: python examples/run_validation_checks.py

      - name: Run trend + benchmark validation suite (pass/fail gate)
        run: python examples/run_benchmark_validation_report.py

      - name: Run CLI smoke tests (offline)
        run: |
          ao-ifu validate
          ao-ifu run --mode toy --out /tmp/ao_ifu_ci --quick
          ao-ifu public-data --out /tmp/ao_ifu_ci --quick

      - name: Run extension examples (offline)
        env:
          AO_IFU_ARTIFACT_DIR: ${{ runner.temp }}/ao-ifu-regression-artifacts
        run: |
          # A new directory cannot inherit the committed figures or manifest.
          mkdir "$AO_IFU_ARTIFACT_DIR"
          python - <<'PY'
          import os
          from pathlib import Path
          from ao_fed_ifu.cli import _load_example

          out = Path(os.environ["AO_IFU_ARTIFACT_DIR"])
          for name in (
              "run_science_case_highz_galaxy",
              "run_systematics_report",
              "run_sky_telluric_residuals",
              "run_mode_comparison_dashboard",
              "run_reconstruction_limitations",
          ):
              _load_example(name).generate(out)
          PY

      - name: Gate freshly generated scientific results
        env:
          AO_IFU_ARTIFACT_DIR: ${{ runner.temp }}/ao-ifu-regression-artifacts
          AO_IFU_REQUIRE_ARTIFACTS: "1"
        run: pytest -q tests/test_generated_artifacts.py
