[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ao-fed-ifu-spectrograph-simulation"
version = "0.1.0"
description = "A compact, inspectable Python simulator for AO-fed integral-field spectroscopy (learning/portfolio project, not a calibrated instrument simulator)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Xu Han" }]
maintainers = [{ name = "Xu Han" }]
keywords = [
    "astronomy", "integral-field-spectroscopy", "IFU", "adaptive-optics",
    "spectrograph", "simulation", "datacube", "portfolio",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Astronomy",
]

# Runtime dependencies are deliberately small and CPU-only.
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "matplotlib>=3.7",
    "pandas>=2.0",
]

[project.optional-dependencies]
# Test extra: what CI installs to run pytest and the example scripts.
test = ["pytest>=7.0"]
# Notebook extra: kept separate so the runtime install stays lean.
notebooks = ["jupyter", "ipykernel"]
# Docs/report extra (optional PDF reporting helpers, if ever added).
docs = ["reportlab"]

[project.urls]
Repository = "https://github.com/xuhanphysik/AO-Fed-IFU-Spectrograph-Simulation"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
